async function pageVersoes() {
  shell('versoes', `<div class="loading"><div class="spinner"></div></div>`);
  const { data, error } = await sb.from('app_releases').select('*').order('released_at', { ascending: false }).order('version', { ascending: false });
  const kinds = { lancamento: ['Lançamento', 'blue'], novidade: ['Novidade', 'green'], melhoria: ['Melhoria', ''], correcao: ['Correção', 'amber'], seguranca: ['Segurança', 'red'] };
  const sorted = (data || []).slice().sort((a, b) => b.version.split('.').map(Number).reduce((r, x, i) => r || x - a.version.split('.').map(Number)[i], 0));
  $('#main').innerHTML = `<div class="card-head"><p class="muted">Histórico de tudo que foi lançado no Gestão do Reino. Versão em uso: <b>${APP_VERSION}</b>.</p>
      ${S.isAdmin ? '<button class="btn" id="nv">+ Registrar nova versão</button>' : ''}</div>
    ${error ? `<div class="empty">${esc(errMsg(error))}</div>` : `<div class="timeline">${sorted.map((r, i) => `<article class="rel ${i === 0 ? 'current' : ''}"><header>
      <span class="v">v${esc(r.version)}</span><span class="pill ${kinds[r.kind]?.[1] || ''}">${kinds[r.kind]?.[0] || esc(r.kind)}</span>${i === 0 ? '<span class="pill" style="color:var(--gold)">Mais recente</span>' : ''}
      <span class="muted" style="margin-left:auto;font-size:.88rem">${dateBR(r.released_at)}</span></header>
      <h3 style="font-size:1.05rem;margin-bottom:8px">${esc(r.title)}</h3><ul>${(r.items || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul></article>`).join('') || '<div class="empty">Nenhuma versão registrada.</div>'}</div>`}`;
  if ($('#nv')) $('#nv').onclick = () => {
    const last = sorted[0]?.version.split('.').map(Number) || [0, 0, 0];
    modal('Registrar nova versão', `<div class="stack"><div class="grid2">
      <div class="field"><label>Versão</label><input name="version" value="${last[0]}.${last[1]}.${last[2] + 1}" pattern="\\d+\\.\\d+\\.\\d+" required><small>Formato 1.2.3</small></div>
      <div class="field"><label>Data</label><input type="date" name="released_at" value="${new Date().toISOString().slice(0, 10)}" required></div></div>
      <div class="field"><label>Título</label><input name="title" required maxlength="120"></div>
      <div class="field"><label>Tipo</label><select name="kind">${Object.entries(kinds).map(([k, [l]]) => `<option value="${k}" ${k === 'melhoria' ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>O que mudou</label><textarea name="items" rows="6" placeholder="Um item por linha" required></textarea></div></div>`,
      { submitLabel: 'Publicar', onSubmit: async fd => {
        const items = fd.get('items').split('\n').map(s => s.trim()).filter(Boolean);
        if (!/^\d+\.\d+\.\d+$/.test(fd.get('version'))) throw new Error('Use o formato de versão 1.2.3.');
        if (fd.get('title').trim().length < 3) throw new Error('Informe o título.'); if (!items.length) throw new Error('Descreva ao menos uma mudança.');
        const { error } = await sb.from('app_releases').insert({ version: fd.get('version'), released_at: fd.get('released_at'), title: fd.get('title').trim(), kind: fd.get('kind'), items, created_by: S.user.id });
        if (error) throw new Error(error.code === '23505' ? 'Essa versão já existe.' : errMsg(error)); toast('Versão publicada.'); pageVersoes(); } });
  };
}

  const ult3 = hist.slice(-3).reduce((a, m) => a + m.igrejas, 0) / 3;
  const ticketReal = n(f.clientes_ativos) ? n(f.mrr) / n(f.clientes_ativos) : null;
  const mesNome = m => new Date(m + '-15').toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' }).replace('.', '');
  $('#main').innerHTML = `
    <div class="kpis">
      <div class="kpi"><small>Receita mensal recorrente</small><strong style="font-size:1.45rem">${brl(f.mrr)}</strong><em>${f.clientes_ativos} cliente${f.clientes_ativos == 1 ? '' : 's'} ativo${f.clientes_ativos == 1 ? '' : 's'}</em></div>
      <div class="kpi"><small>Receita anual (ARR)</small><strong style="font-size:1.45rem">${brl(n(f.mrr) * 12)}</strong><em>MRR × 12</em></div>
      <div class="kpi"><small>Em risco (inadimplentes)</small><strong style="font-size:1.45rem;color:${n(f.mrr_em_risco) ? 'var(--red)' : 'inherit'}">${brl(f.mrr_em_risco)}</strong><em>${f.clientes_inadimplentes} cliente(s) com pagamento pendente</em></div>
      <div class="kpi"><small>Potencial dos testes</small><strong style="font-size:1.45rem">${brl(f.potencial_testes)}</strong><em>${f.testes_ativos} igreja(s) em teste, por mês</em></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Previsão de curto prazo</h3><p class="muted" style="font-size:.88rem;margin:4px 0 14px">Testes grátis que terminam em breve e quanto podem gerar se virarem assinatura.</p>
        <table><tbody>
          <tr><td>Testes que vencem em 7 dias</td><td style="text-align:right"><b>${f.testes_7d}</b></td><td style="text-align:right">${brl(f.potencial_7d)}/mês</td></tr>
          <tr><td>Testes que vencem em 30 dias</td><td style="text-align:right"><b>${f.testes_30d}</b></td><td style="text-align:right">${brl(f.potencial_30d)}/mês</td></tr>
          <tr><td>Testes já expirados sem contratar</td><td style="text-align:right"><b>${f.testes_expirados}</b></td><td></td></tr>
          <tr><td>Suspensos ou cancelados</td><td style="text-align:right"><b>${f.cancelados}</b></td><td></td></tr>
          <tr><td>Conversão histórica de testes</td><td style="text-align:right" colspan="2"><b>${f.conversao_historica == null ? 'sem histórico ainda' : f.conversao_historica + '%'}</b></td></tr>
        </tbody></table></div>
      <div class="card"><h3>Receita por plano</h3><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Plano</th><th style="text-align:right">Ativos</th><th style="text-align:right">Em teste</th><th style="text-align:right">MRR</th></tr></thead><tbody>
        ${(f.por_plano || []).map(p => `<tr><td>${esc(p.plano)}</td><td style="text-align:right">${p.ativos}</td><td style="text-align:right">${p.testes}</td><td style="text-align:right">${brl(p.mrr)}</td></tr>`).join('')}
      </tbody></table></div></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="card-head"><div><h3>Projeção de receita — próximos 12 meses</h3><p class="muted" style="font-size:.88rem">Estimativa a partir dos dados reais de hoje. Ajuste as premissas para simular cenários.</p></div></div>
      <div class="grid3" id="prem">
        <div class="field"><label>Conversão de testes em clientes (%)</label><input type="number" name="conv" min="0" max="100" value="${f.conversao_historica ?? 30}"><small>${f.conversao_historica == null ? 'Sugestão inicial; ainda não há histórico' : 'Valor inicial = sua conversão histórica'}</small></div>
        <div class="field"><label>Novas igrejas em teste por mês</label><input type="number" name="novas" min="0" step="1" value="${Math.round(ult3 * 10) / 10}"><small>Valor inicial = média dos últimos 3 meses</small></div>
        <div class="field"><label>Valor médio por cliente (R$/mês)</label><input name="ticket" inputmode="decimal" value="${moneyIn(ticketReal ?? 149)}"><small>${ticketReal ? 'Valor inicial = média dos clientes ativos' : 'Sugestão inicial; ajuste ao seu plano mais vendido'}</small></div>
      </div>
      <div id="proj" style="margin-top:18px"></div>
    </div>
    <div class="card" style="margin-top:14px"><h3>Novas igrejas por mês</h3><div id="novasChart" style="margin-top:14px"></div></div>`;
  const bars = (vals, labels, fmt, hl = true) => { const max = Math.max(1, ...vals); const W = 760, H = 200, bw = W / vals.length;
    return `<svg viewBox="0 0 ${W} ${H + 40}" width="100%" role="img" style="max-height:280px">${vals.map((v, i) => { const h = Math.round(v / max * H);
      return `<g><rect x="${i * bw + 6}" y="${H - h + 18}" width="${bw - 12}" height="${Math.max(h, 1)}" rx="5" fill="${hl && i === 0 ? 'var(--gold)' : 'var(--royal)'}"><title>${labels[i]}: ${fmt(v)}</title></rect>
      <text x="${i * bw + bw / 2}" y="${H - h + 12}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmt(v)}</text>
      <text x="${i * bw + bw / 2}" y="${H + 34}" text-anchor="middle" font-size="11" fill="var(--muted)">${labels[i]}</text></g>`; }).join('')}</svg>`; };
  const k = v => v >= 1000 ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : Math.round(v).toLocaleString('pt-BR');
  $('#novasChart').innerHTML = bars(hist.map(m => m.igrejas), hist.map(m => mesNome(m.mes)), v => String(v), false);
  const calc = () => {
    const P = new FormData(); $('#prem').querySelectorAll('input').forEach(i => P.set(i.name, i.value));
    const conv = Math.min(100, Math.max(0, Number(P.get('conv')) || 0)) / 100, novas = Math.max(0, Number(P.get('novas')) || 0), ticket = parseMoney(P.get('ticket')) ?? 0;
    const base = n(f.mrr) + conv * n(f.potencial_30d);
    const months = [], labels = []; const now = new Date();
    for (let i = 1; i <= 12; i++) { const d = new Date(now.getFullYear(), now.getMonth() + i, 15);
      months.push(Math.round((base + novas * conv * ticket * (i - 1)) * 100) / 100); labels.push(d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')); }
    const total = months.reduce((a, b) => a + b, 0);
    $('#proj').innerHTML = `<div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">
        <div class="kpi"><small>MRR previsto no próximo mês</small><strong style="font-size:1.3rem">${brl(months[0])}</strong></div>
        <div class="kpi"><small>MRR previsto em 12 meses</small><strong style="font-size:1.3rem">${brl(months[11])}</strong></div>
        <div class="kpi"><small>Receita prevista em 12 meses</small><strong style="font-size:1.3rem">${brl(total)}</strong></div></div>
      ${bars(months, labels, k)}
      <p class="muted" style="font-size:.8rem">Cálculo: MRR atual + conversão × potencial dos testes que vencem em 30 dias, somando a cada mês as novas igrejas × conversão × valor médio. É uma estimativa, não receita garantida; cancelamentos não estão incluídos.</p>`;
  };
  $('#prem').addEventListener('input', calc); calc();
}
async function pageAdminPlanos() {
  shell('admin-planos', `<div class="loading"><div class="spinner"></div></div>`);
  const [{ data: plans, error }, { data: set }] = await Promise.all([sb.from('plans').select('*').order('sort_order'), sb.from('platform_settings').select('value').eq('key', 'trial_days').single()]);
  if (error) { $('#main').innerHTML = `<div class="empty">${esc(errMsg(error))}</div>`; return; }
  const trialDays = Number(set?.value) || 14;
  $('#main').innerHTML = `<div class="banner info"><div>Os valores salvos aqui aparecem <b>automaticamente no site</b> e valem para novas igrejas. Assinaturas existentes mantêm o valor contratado.</div></div>
    <div class="card" style="margin-bottom:16px"><form id="tf" class="toolbar" style="margin:0;align-items:end" novalidate><div class="field" style="flex:1;min-width:200px"><label>Duração do teste grátis (dias)</label><input name="d" type="number" min="1" max="90" value="${trialDays}" required></div><button class="btn" type="submit">Salvar</button><button type="button" class="btn ghost" id="np">+ Novo plano</button></form></div>
    <div class="plans-edit">${plans.map(p => planCard(p)).join('')}</div>`;
  $('#tf').onsubmit = async e => { e.preventDefault(); const d = Number(new FormData(e.target).get('d'));
    if (!(d >= 1 && d <= 90)) return toast('Informe entre 1 e 90 dias.', 'err');
    const { error } = await sb.from('platform_settings').update({ value: d }).eq('key', 'trial_days'); if (error) return toast(errMsg(error), 'err'); toast('Duração do teste atualizada.'); };
  $('#np').onclick = () => modal('Novo plano', `<div class="stack"><div class="grid2"><div class="field"><label>Nome</label><input name="name" required maxlength="60"></div>
    <div class="field"><label>Código</label><input name="code" required pattern="[a-z0-9_-]{2,40}" placeholder="ex.: premium"><small>Letras minúsculas, sem espaço</small></div></div>
    <div class="field"><label>Mensalidade</label><div class="money"><span>R$</span><input name="price" inputmode="decimal" required placeholder="0,00"></div></div></div>`,
    { submitLabel: 'Criar plano', onSubmit: async fd => {
      const price = parseMoney(fd.get('price')); if (price === null) throw new Error('Valor inválido.');
      const code = fd.get('code').trim(); if (!/^[a-z0-9_-]{2,40}$/.test(code)) throw new Error('Código inválido: use letras minúsculas, números, - ou _.');
      const { error } = await sb.from('plans').insert({ name: fd.get('name').trim(), code, price_monthly: price, sort_order: plans.length + 1, is_active: false });
      if (error) throw new Error(error.code === '23505' ? 'Já existe um plano com este código.' : errMsg(error)); toast('Plano criado como inativo. Complete e ative.'); pageAdminPlanos(); } });
  document.querySelectorAll('form[data-plan]').forEach(f => f.onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(f), btn = f.querySelector('[type=submit]');
    const pm = parseMoney(fd.get('price_monthly')), py = fd.get('price_yearly').trim() ? parseMoney(fd.get('price_yearly')) : null;
    if (pm === null) return toast('Mensalidade inválida.', 'err');
    if (fd.get('price_yearly').trim() && py === null) return toast('Valor anual inválido.', 'err');
    const intOrNull = k => { const v = fd.get(k).trim(); return v ? Math.max(1, parseInt(v, 10)) : null; };
    const row = { name: fd.get('name').trim(), description: fd.get('description').trim(), price_monthly: pm, price_yearly: py,
      max_users: intOrNull('max_users'), max_congregations: intOrNull('max_congregations'),
      features: fd.get('features').split('\n').map(s => s.trim()).filter(Boolean), cta_label: fd.get('cta_label').trim() || 'Começar teste grátis',
      is_featured: fd.get('is_featured') === 'on', is_active: fd.get('is_active') === 'on', sort_order: parseInt(fd.get('sort_order'), 10) || 0 };
    if (row.name.length < 2) return toast('Informe o nome do plano.', 'err');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const { error } = await sb.from('plans').update(row).eq('id', f.dataset.plan);
    btn.disabled = false; btn.textContent = 'Salvar plano';
    if (error) return toast(errMsg(error), 'err'); toast(`Plano ${row.name} salvo.`);
  });
}
const parseMoney = s => { s = String(s || '').trim().replace(/[R$\s]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return s !== '' && isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null; };
const moneyIn = n => n === null || n === undefined ? '' : Number(n).toFixed(2).replace('.', ',');
function planCard(p) {
  return `<form class="plan-card ${p.is_featured ? 'featured' : ''}" data-plan="${p.id}" novalidate>
    <header><h3>${esc(p.name)}</h3><span class="pill ${p.is_active ? 'green' : ''}">${p.is_active ? 'Ativo no site' : 'Inativo'}</span></header>
    <div class="grid2"><div class="field"><label>Nome</label><input name="name" value="${esc(p.name)}" maxlength="60"></div>
      <div class="field"><label>Ordem no site</label><input name="sort_order" type="number" value="${p.sort_order}"></div></div>
    <div class="grid2"><div class="field"><label>Mensalidade</label><div class="money"><span>R$</span><input name="price_monthly" inputmode="decimal" value="${moneyIn(p.price_monthly)}"></div></div>
      <div class="field"><label>Valor anual</label><div class="money"><span>R$</span><input name="price_yearly" inputmode="decimal" value="${moneyIn(p.price_yearly)}" placeholder="${moneyIn(p.price_monthly * 10)}"></div><small>Vazio = 10 mensalidades</small></div></div>
    <div class="grid2"><div class="field"><label>Limite de usuários</label><input name="max_users" type="number" min="1" value="${p.max_users ?? ''}" placeholder="Ilimitado"></div>
      <div class="field"><label>Limite de congregações</label><input name="max_congregations" type="number" min="1" value="${p.max_congregations ?? ''}" placeholder="Ilimitado"></div></div>
    <div class="field"><label>Descrição</label><textarea name="description" rows="2">${esc(p.description)}</textarea></div>
    <div class="field"><label>Itens exibidos no site</label><textarea name="features" rows="5">${esc((p.features || []).join('\n'))}</textarea><small>Um item por linha</small></div>
    <div class="field"><label>Texto do botão</label><input name="cta_label" value="${esc(p.cta_label)}" maxlength="40"></div>
    <label class="check"><input type="checkbox" name="is_featured" ${p.is_featured ? 'checked' : ''}> Destacar como "mais escolhido"</label>
    <label class="check"><input type="checkbox" name="is_active" ${p.is_active ? 'checked' : ''}> Exibir no site e permitir novas assinaturas</label>
    <button class="btn" type="submit">Salvar plano</button></form>`;
}

/* ===== Roteador ===== */
async function render() {
  const { route, params } = hashParams();
  if (S.recovering) return viewNewPassword();
  if (!S.session) {
    if (route === 'cadastro') return viewSignup(params);
    if (route === 'recuperar') return viewRecover();
    return viewLogin();
  }
  try {
    if (['entrar', 'cadastro', 'recuperar', ''].includes(route)) return go(S.org ? 'painel' : S.isAdmin ? 'admin' : 'criar-igreja');
    if (route.startsWith('admin')) {
      if (!S.isAdmin) return go('painel');
      if (route === 'admin') return pageAdmin();
      if (route === 'admin-igrejas') return pageAdminIgrejas();
      if (route === 'admin-planos') return pageAdminPlanos();
      if (route === 'admin-financeiro') return pageAdminFinanceiro();
    }
    if (route === 'versoes') return S.isAdmin ? pageVersoes() : go(S.org ? 'painel' : 'criar-igreja');
    if (!S.org) return S.isAdmin && route !== 'criar-igreja' ? go('admin') : pageCriarIgreja();
    if (route === 'membros') return pageMembros(params);
    if (route === 'igreja') return pageIgreja();
    const MODS = { familias: pageFamilias, grupos: pageGrupos, ministerios: pageMinisterios, escalas: () => pageEscalas(params), eventos: pageEventos, ensino: pageEnsino, estudos: pageEstudos,
      discipulado: pageDiscipulado, patrimonio: pagePatrimonio, visitantes: pageVisitantes, visitas: () => canVisit() ? pageVisitas(params) : go('painel'), mapa: pageMapa, certificados: pageCertificados, relatorios: pageRelatorios, site: pageSite, historico: () => canAudit() ? pageHistorico() : go('painel') };
    if (MODS[route]) return await MODS[route]();
    if (['caixa', 'contas', 'fin-config', 'campanhas'].includes(route)) {
      if (!canSeeFin()) { toast('Seu perfil não tem acesso ao financeiro.', 'err'); return go('painel'); }
      if (route === 'caixa') return await pageCaixa(params);
      if (route === 'contas') return await pageContas(params);
      if (route === 'campanhas') return await pageCampanhas();
      return await pageFinConfig();
    }
    return pagePainel();
  } catch (e) { toast(errMsg(e), 'err'); }
}
window.addEventListener('hashchange', render);

let booted = false;
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') S.recovering = true;
  if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') { S.session = session; return; }
  const changed = (S.session?.user?.id || null) !== (session?.user?.id || null);
  S.session = session;
  if (!booted || changed || event === 'PASSWORD_RECOVERY') {
    booted = true;
    setTimeout(async () => { try { await loadContext(); } catch (e) { toast(errMsg(e), 'err'); } if (!session) { S.org = null; S.isAdmin = false; } render(); }, 0);
  }
});
</script>
