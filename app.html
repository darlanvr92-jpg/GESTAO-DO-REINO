<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel — Gestão do Reino</title>
<meta name="theme-color" content="#0B1F3A">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1F3A'/%3E%3Cpath d='M16 42h32v5H16zM18 40l4-16 7 8 3-12 3 12 7-8 4 16z' fill='%23C9A24B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--royal:#2453D6;--royal-2:#1C43B3;--gold:#C9A24B;--green:#15935B;--red:#D2453B;--amber:#B7791F;
--bg:#F4F6FA;--surface:#fff;--surface-2:#F8FAFD;--text:#14213A;--muted:#5B6782;--line:#E2E7F0;--shadow:0 10px 30px -14px rgba(11,31,58,.25)}
[data-theme="dark"]{--bg:#0A1424;--surface:#111E33;--surface-2:#0E1A2D;--text:#E8EDF6;--muted:#9AA8C2;--line:#22324D;--shadow:0 10px 30px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;line-height:1.2}
a{color:var(--royal)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;border:1px solid transparent;font-weight:600;cursor:pointer;background:var(--royal);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--royal-2)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--royal);color:var(--royal)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.danger{background:var(--red)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:9px}
.btn.block{width:100%}
.field{display:grid;gap:6px}
.field label{font-size:.85rem;font-weight:600}
.field small{color:var(--muted);font-size:.78rem}
input,select,textarea{min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 3px color-mix(in srgb,var(--royal) 18%,transparent)}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--royal)}
.check{display:flex;gap:10px;align-items:center;font-size:.92rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stack{display:grid;gap:14px}
.muted{color:var(--muted)}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:700;font-size:1.15rem;color:inherit;text-decoration:none}
.mark{width:36px;height:36px;border-radius:10px;background:var(--navy);display:grid;place-items:center;flex:none}
[data-theme="dark"] .mark{background:#1A3460}

/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-side{background:radial-gradient(900px 400px at 90% 0,rgba(36,83,214,.35),transparent 60%),linear-gradient(160deg,#0B1F3A,#10294D);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.auth-side .brand{color:#fff}
.auth-side h1{font-size:2.3rem;margin:16px 0}
.auth-side p{color:#C3CFE6;max-width:440px}
.auth-side ul{list-style:none;display:grid;gap:10px;margin-top:24px;color:#DDE5F3}
.auth-side li::before{content:"✓";color:var(--gold);font-weight:700;margin-right:10px}
.auth-main{display:grid;place-items:center;padding:32px 20px}
.auth-card{width:min(440px,100%)}
.auth-card h2{font-size:1.7rem;margin-bottom:6px}
.auth-card form{margin-top:22px}
.auth-links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:.92rem}
.auth-links a{cursor:pointer}

/* Shell */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.shell>div{min-width:0}
.side{background:var(--navy);color:#C9D4EA;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{color:#fff;padding:6px 8px 18px}
.side .sec{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:#7F92B6;padding:14px 10px 6px}
.side a.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#C9D4EA;text-decoration:none;font-weight:500;font-size:.95rem;min-height:44px}
.side a.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.side a.nav.on{background:var(--royal);color:#fff}
.side a.nav svg{flex:none;opacity:.9}
.side .grow{flex:1}
.side .ver{font-size:.75rem;color:#7F92B6;padding:8px 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.top h1{font-size:1.35rem}
.top .right{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer}
.user{position:relative}
.user-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:transparent;border-radius:12px;padding:4px 10px 4px 4px;cursor:pointer;min-height:42px}
.avatar{width:32px;height:32px;border-radius:9px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.user-btn span{font-size:.88rem;font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:240px;padding:6px;display:grid}
.menu button{text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.92rem}
.menu button:hover{background:var(--surface-2)}
.menu .who{padding:10px 12px;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px;word-break:break-all}
.menu-toggle{display:none}
main.content{padding:28px;max-width:1240px;width:100%}
.banner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:14px;margin-bottom:22px;border:1px solid}
.banner.info{background:color-mix(in srgb,var(--royal) 8%,var(--surface));border-color:color-mix(in srgb,var(--royal) 30%,var(--line))}
.banner.warn{background:color-mix(in srgb,var(--amber) 10%,var(--surface));border-color:color-mix(in srgb,var(--amber) 40%,var(--line))}
.banner.err{background:color-mix(in srgb,var(--red) 8%,var(--surface));border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpi small{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi strong{display:block;font-size:1.8rem;font-family:Fraunces,serif;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:.82rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h3{font-size:1.15rem;margin-bottom:4px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{flex:1;min-width:200px}
.toolbar select{width:auto;min-width:150px}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.table-wrap{overflow-x:auto}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:.76rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.green{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,transparent);background:color-mix(in srgb,var(--green) 10%,transparent)}
.pill.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent)}
.pill.blue{color:var(--royal);border-color:color-mix(in srgb,var(--royal) 35%,transparent);background:color-mix(in srgb,var(--royal) 10%,transparent)}
.pill.amber{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.plans-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.plan-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px}
.plan-card.featured{border:2px solid var(--royal)}
.plan-card header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.money{position:relative;align-self:start}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem}
.money input{padding-left:38px;font-variant-numeric:tabular-nums}
.timeline{display:grid;gap:16px}
.rel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;position:relative}
.rel.current{border-color:color-mix(in srgb,var(--gold) 70%,var(--line))}
.rel header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.rel .v{font-family:Fraunces,serif;font-size:1.3rem;font-weight:700}
.rel ul{padding-left:20px;display:grid;gap:5px;color:var(--text)}
.rel ul li::marker{color:var(--gold)}
/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(6,14,28,.55);display:grid;place-items:center;padding:16px;z-index:100}
.modal{background:var(--surface);border-radius:18px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.modal .body{padding:22px}
.modal footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:10px;z-index:200;max-width:min(380px,calc(100vw - 32px))}
.toast{padding:12px 16px;border-radius:12px;color:#fff;box-shadow:var(--shadow);font-size:.92rem;animation:in .2s ease}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.info{background:var(--navy)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--royal);animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.form-err{color:var(--red);font-size:.88rem;min-height:20px}
.mobile-only{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap;font-size:.93rem;margin-bottom:-1px}
.tabs a:hover{color:var(--text)}.tabs a.on{color:var(--royal);border-bottom-color:var(--royal)}
.toolbar .field{flex:1;min-width:150px}.toolbar .field input,.toolbar .field select{min-width:0;width:100%}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.v-in{color:var(--green);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.v-out{color:var(--red);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.canceled td{opacity:.6}tr.canceled .v-in,tr.canceled .v-out{text-decoration:line-through}
.kpi strong.mk{font-size:1.45rem}.kpi strong.pos{color:var(--green)}.kpi strong.neg{color:var(--red)}
@media (max-width:1000px){.kpis{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .auth{grid-template-columns:1fr}.auth-side{display:none}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(6,14,28,.5)}
  .menu-toggle{display:grid}
  .top{padding:12px 16px}.top h1{font-size:1.1rem}
  main.content{padding:18px 14px}
  .user-btn span{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .hide-sm{display:none}
  .mobile-only{display:block}
}
</style>
</head>
<body>
<div id="root"><div class="loading"><div><div class="spinner"></div>Carregando…</div></div></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ===== Conexão com o banco (chave pública; a segurança fica nas políticas RLS) ===== */
const SUPABASE_URL = 'https://ifttmkpmwcjsyoxofmry.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MIfamF2fKJOf_1WcoFPYOA_47DozgNd';
const APP_VERSION = '0.4.1';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

/* ===== Utilidades ===== */
const $ = (s, el = document) => el.querySelector(s);
const root = $('#root');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = n => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dateBR = d => d ? new Date(d.length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('pt-BR') : '—';
const daysLeft = d => Math.ceil((new Date(d) - new Date()) / 86400000);
const errMsg = e => {
  const m = e?.message || String(e);
  const map = {
    'Invalid login credentials': 'E-mail ou senha incorretos.',
    'Email not confirmed': 'Confirme seu e-mail pelo link que enviamos antes de entrar.',
    'User already registered': 'Já existe uma conta com este e-mail. Use "Entrar".',
    'Password should be at least 6 characters': 'A senha precisa ter pelo menos 6 caracteres.',
  };
  for (const k in map) if (m.includes(k)) return map[k];
  if (/duplicate key|23505/i.test(m)) return 'Já existe um registro com esse nome.';
  if (/rate limit/i.test(m)) return 'Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente novamente.';
  if (/row-level security|permission denied/i.test(m)) return 'Você não tem permissão para esta ação, ou o período de teste da igreja terminou.';
  return m;
};
function toast(msg, type = 'ok') {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), type === 'err' ? 6000 : 3500);
}
function confirmBox(title, text, okLabel = 'Confirmar', danger = false) {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="width:min(440px,100%)"><header><h3>${esc(title)}</h3></header>
      <div class="body"><p class="muted">${esc(text)}</p></div>
      <footer><button class="btn ghost" data-v="0">Cancelar</button><button class="btn ${danger ? 'danger' : ''}" data-v="1">${esc(okLabel)}</button></footer></div>`;
    o.addEventListener('click', e => { const v = e.target.dataset?.v; if (v !== undefined || e.target === o) { o.remove(); res(v === '1'); } });
    document.body.appendChild(o); o.querySelector('[data-v="1"]').focus();
  });
}
function modal(title, bodyHtml, { submitLabel = 'Salvar', busyLabel = 'Salvando…', onSubmit } = {}) {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<form class="modal" role="dialog" aria-modal="true" novalidate><header><h3>${esc(title)}</h3>
    <button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button></header>
    <div class="body">${bodyHtml}<div class="form-err" data-err></div></div>
    <footer><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn" type="submit">${esc(submitLabel)}</button></footer></form>`;
  const close = () => o.remove();
  o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-close]')) close(); });
  o.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  const form = o.querySelector('form');
  form.addEventListener('submit', async e => {
    e.preventDefault(); const btn = form.querySelector('[type=submit]'); const err = form.querySelector('[data-err]');
    err.textContent = ''; btn.disabled = true; btn.textContent = busyLabel;
    try { await onSubmit(new FormData(form), form); close(); }
    catch (ex) { err.textContent = errMsg(ex); btn.disabled = false; btn.textContent = submitLabel; }
  });
  document.body.appendChild(o); form.querySelector('input,select,textarea')?.focus();
  return o;
}
const icon = p => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  home: icon('<path d="M3 11l9-8 9 8M5 10v10h14V10"/>'),
  users: icon('<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 9M22 21a7 7 0 0 0-4-6.3"/>'),
  church: icon('<path d="M3 21h18M5 21V10l7-6 7 6v11M10 21v-6h4v6"/>'),
  money: icon('<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),
  tag: icon('<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>'),
  chart: icon('<path d="M3 3v18h18M7 15l4-4 3 3 5-6"/>'),
  ver: icon('<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/>'),
  menu: icon('<path d="M4 7h16M4 12h16M4 17h16"/>'),
  cash: icon('<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4M18 10v4"/>'),
  bill: icon('<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h5"/>'),
  moon: icon('<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>'),
};
const markSvg = '<svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 50h48v6H8zM11 46l6-26 11 13 4-19 4 19 11-13 6 26z" fill="#C9A24B"/></svg>';

/* Tema */
function applyTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('gr-theme', t) } catch {} }
let th = null; try { th = localStorage.getItem('gr-theme') } catch {}
applyTheme(th || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

/* ===== Estado ===== */
const S = { session: null, user: null, profile: null, isAdmin: false, org: null, role: null, sub: null, plan: null, recovering: false };
const hashParams = () => { const [r, q] = location.hash.slice(1).split('?'); return { route: r || '', params: new URLSearchParams(q || '') }; };
const go = r => { if (location.hash.slice(1) === r) render(); else location.hash = r; };

/* ===== Autenticação ===== */
function authLayout(inner) {
  root.innerHTML = `<div class="auth">
    <aside class="auth-side"><a class="brand" href="index.html"><span class="mark">${markSvg}</span>Gestão do Reino</a>
      <div><h1>A administração da sua igreja, organizada.</h1>
      <p>Membros, congregações, finanças e prestação de contas em um só lugar, com os dados da sua igreja protegidos.</p>
      <ul><li>Teste grátis, sem cartão</li><li>Dados isolados por igreja</li><li>Funciona no computador e no celular</li></ul></div>
      <small style="color:#7F92B6">Versão ${APP_VERSION}</small></aside>
    <section class="auth-main"><div class="auth-card">${inner}</div></section></div>`;
}
function bindAuthForm(handler) {
  const f = $('form', root), err = $('[data-err]', root), btn = $('[type=submit]', root), label = btn.textContent;
  f.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Aguarde…';
    try { await handler(new FormData(f)); } catch (ex) { err.textContent = errMsg(ex); }
    btn.disabled = false; btn.textContent = label;
  });
}

async function loadContext() {
  S.user = S.session?.user || null;
  if (!S.user) return;
  const [adm, prof, mem] = await Promise.all([
    sb.rpc('is_platform_admin'),
    sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle(),
    sb.from('organization_members').select('role,status,organization_id,organizations(id,name,status,created_at,is_internal)').eq('user_id', S.user.id).eq('status', 'active').limit(1),
  ]);
  S.isAdmin = !!adm.data; S.profile = prof.data;
  const m = mem.data?.[0];
  S.org = m?.organizations || null; S.role = m?.role || null; S.sub = null; S.plan = null;
  if (!S.org && !S.isAdmin && S.user.user_metadata?.church_name && !S._autoTried) {
    S._autoTried = true;
    const { error } = await sb.rpc('create_my_organization', { p_name: S.user.user_metadata.church_name, p_plan_code: S.user.user_metadata.plan || 'profissional' });
    if (!error) { toast('Igreja criada! Seu teste grátis começou.'); return loadContext(); }
  }
  if (S.org) {
    const { data } = await sb.from('subscriptions').select('*, plans(name,code,price_monthly,max_users,max_congregations)').eq('organization_id', S.org.id).maybeSingle();
    S.sub = data; S.plan = data?.plans || null;
  }
}

function statusBanner() {
  if (!S.org || !S.sub) return '';
  if (S.org.is_internal) return `<div class="banner info"><div><b>Igreja do proprietário</b> — acesso vitalício, sem cobrança e fora das métricas comerciais.</div></div>`;
  if (S.org.status === 'suspended') return `<div class="banner err"><div><b>Acesso suspenso.</b> Os dados continuam guardados, mas novos lançamentos estão bloqueados. Fale com o suporte.</div></div>`;
  if (S.sub.status === 'trialing') {
    const d = daysLeft(S.sub.trial_ends_at);
    if (d <= 0) return `<div class="banner err"><div><b>Seu teste grátis terminou.</b> Você ainda pode consultar os dados. Para voltar a cadastrar, contrate um plano.</div></div>`;
    return `<div class="banner ${d <= 3 ? 'warn' : 'info'}"><div><b>Teste grátis — ${d} dia${d > 1 ? 's' : ''} restante${d > 1 ? 's' : ''}.</b> Plano ${esc(S.plan?.name)} até ${dateBR(S.sub.trial_ends_at)}.</div></div>`;
  }
  if (S.sub.status === 'past_due') return `<div class="banner warn"><div><b>Pagamento pendente.</b> Regularize para evitar a suspensão.</div></div>`;
  return '';
}

/* ===== Financeiro ===== */
const canSeeFin = () => ['admin', 'pastor', 'tesoureiro', 'visualizador'].includes(S.role);
const canEditFin = () => ['admin', 'pastor', 'tesoureiro'].includes(S.role) && orgOperational();
const ymd = d => d.toLocaleDateString('sv-SE');
const monthRange = (ref = new Date(), add = 0) => [ymd(new Date(ref.getFullYear(), ref.getMonth() + add, 1)), ymd(new Date(ref.getFullYear(), ref.getMonth() + add + 1, 0))];
const parseValor = v => {
  let s = String(v ?? '').replace(/[R$\s ]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return Math.round(Number(s) * 100) / 100;
};
const moneyField = v => v == null || v === '' ? '' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const PAY_METHODS = [['', 'Não informado'], ['dinheiro', 'Dinheiro'], ['pix', 'Pix'], ['cartao', 'Cartão'], ['transferencia', 'Transferência'], ['boleto', 'Boleto'], ['cheque', 'Cheque'], ['outro', 'Outro']];
const payName = v => v ? (PAY_METHODS.find(p => p[0] === v)?.[1] || v) : '—';
const ACC_KINDS = [['caixa', 'Caixa (dinheiro)'], ['banco', 'Conta bancária'], ['digital', 'Conta digital / Pix']];
const opts = (list, sel) => list.map(([v, l]) => `<option value="${esc(v)}" ${String(sel ?? '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('');
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'igreja';
const spin = '<div class="loading" style="min-height:200px"><div class="spinner"></div></div>';

const FIN = { accounts: [], categories: [] };
async function loadFinMeta() {
  const [a, c] = await Promise.all([
    sb.from('finance_accounts').select('*').eq('organization_id', S.org.id).order('name'),
    sb.from('finance_categories').select('*').eq('organization_id', S.org.id).order('name'),
  ]);
  if (a.error) throw a.error; if (c.error) throw c.error;
  FIN.accounts = a.data || []; FIN.categories = c.data || [];
}
const accName = id => FIN.accounts.find(a => a.id === id)?.name || '—';
const catName = id => FIN.categories.find(c => c.id === id)?.name || '—';
const finTabs = route => `<nav class="tabs" aria-label="Financeiro">${[['caixa', 'Caixa'], ['contas', 'Contas a pagar e a receber'], ['fin-config', 'Caixas e categorias']]
  .map(([r, l]) => `<a href="#${r}" class="${r === route ? 'on' : ''}">${l}</a>`).join('')}</nav>`;
const readOnlyNote = () => !canEditFin() ? `<p class="muted" style="font-size:.85rem;margin-bottom:12px">${['admin', 'pastor', 'tesoureiro'].includes(S.role) ? 'Lançamentos bloqueados: teste encerrado ou acesso suspenso. Você ainda pode consultar e exportar.' : 'Seu perfil permite apenas consultar e exportar o financeiro.'}</p>` : '';

/* --- Caixa (entradas e saídas) --- */
async function pageCaixa(params) {
  shell('caixa', spin);
  await loadFinMeta();
  const [d1, d2] = monthRange();
  $('#main').innerHTML = `${statusBanner()}${finTabs('caixa')}${readOnlyNote()}
    <div class="kpis" id="k"></div>
    <div class="card">
      <div class="toolbar">
        <div class="field"><label for="d1">De</label><input type="date" id="d1" value="${esc(params.get('de') || d1)}"></div>
        <div class="field"><label for="d2">Até</label><input type="date" id="d2" value="${esc(params.get('ate') || d2)}"></div>
        <div class="field"><label for="ac">Caixa / conta</label><select id="ac"><option value="">Todos os caixas</option>${FIN.accounts.map(a => `<option value="${a.id}">${esc(a.name)}${a.is_active ? '' : ' (inativo)'}</option>`).join('')}</select></div>
        <div class="field"><label for="tp">Tipo</label><select id="tp"><option value="">Entradas e saídas</option><option value="entrada">Só entradas</option><option value="saida">Só saídas</option></select></div>
      </div>
      <div class="toolbar">
        <button class="btn sm ghost" data-p="0">Este mês</button><button class="btn sm ghost" data-p="-1">Mês passado</button><button class="btn sm ghost" data-p="y">Este ano</button>
        <span style="flex:1"></span>
        ${canEditFin() ? `<button class="btn" id="ne">+ Entrada</button><button class="btn danger" id="ns">+ Saída</button>` : ''}
        <button class="btn ghost" id="pdf">Exportar PDF</button>
      </div>
      <div id="list">${spin}</div></div>`;
  const cur = () => ({ start: $('#d1').value, end: $('#d2').value, account: $('#ac').value, type: $('#tp').value });
  const load = async () => {
    const st = cur();
    if (!st.start || !st.end || st.end < st.start) { $('#k').innerHTML = ''; $('#list').innerHTML = '<div class="empty">Escolha um período válido.</div>'; return; }
    $('#list').innerHTML = spin;
    let q = sb.from('finance_transactions').select('*').eq('organization_id', S.org.id).gte('occurred_on', st.start).lte('occurred_on', st.end)
      .order('occurred_on', { ascending: false }).order('created_at', { ascending: false }).limit(2000);
    if (st.account) q = q.eq('account_id', st.account);
    if (st.type) q = q.eq('type', st.type);
    const [rep, tx] = await Promise.all([sb.rpc('finance_cash_report', { p_org: S.org.id, p_start: st.start, p_end: st.end, p_account: st.account || null }), q]);
    if (rep.error || tx.error) { $('#k').innerHTML = ''; $('#list').innerHTML = `<div class="empty">${esc(errMsg(rep.error || tx.error))}</div>`; return; }
    const r = rep.data, rows = tx.data || [];
    const res = Number(r.total_entradas) - Number(r.total_saidas);
    $('#k').innerHTML = `
      <div class="kpi"><small>Saldo em ${dateBR(st.start)}</small><strong class="mk">${brl(r.saldo_inicial)}</strong><em>antes do período</em></div>
      <div class="kpi"><small>Entradas</small><strong class="mk pos">${brl(r.total_entradas)}</strong></div>
      <div class="kpi"><small>Saídas</small><strong class="mk neg">${brl(r.total_saidas)}</strong></div>
      <div class="kpi"><small>Saldo em ${dateBR(st.end)}</small><strong class="mk ${Number(r.saldo_final) < 0 ? 'neg' : ''}">${brl(r.saldo_final)}</strong><em>Resultado do período: ${brl(res)}</em></div>`;
    const memIds = [...new Set(rows.map(x => x.member_id).filter(Boolean))];
    let mem = {};
    if (memIds.length) { const { data } = await sb.from('members').select('id,full_name').in('id', memIds); (data || []).forEach(m => mem[m.id] = m.full_name); }
    $('#list').innerHTML = rows.length ? `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th class="hide-sm">Caixa</th><th class="hide-sm">Forma</th><th class="num">Valor</th><th></th></tr></thead><tbody>
      ${rows.map(x => `<tr class="${x.status === 'cancelado' ? 'canceled' : ''}">
        <td style="white-space:nowrap">${dateBR(x.occurred_on)}</td>
        <td><b>${esc(x.description || catName(x.category_id))}</b>
          <div class="muted" style="font-size:.82rem">${esc(catName(x.category_id))}${x.member_id ? ' · ' + esc(mem[x.member_id] || 'Membro') : ''}${x.document ? ' · Doc. ' + esc(x.document) : ''}${x.payable_id ? ' · baixa de conta' : ''}</div>
          ${x.status === 'cancelado' ? `<div style="font-size:.8rem;margin-top:3px"><span class="pill red">Cancelado</span> <span class="muted">${esc(x.cancel_reason || '')}</span></div>` : ''}</td>
        <td class="hide-sm">${esc(accName(x.account_id))}</td><td class="hide-sm">${esc(payName(x.payment_method))}</td>
        <td class="num"><span class="${x.type === 'entrada' ? 'v-in' : 'v-out'}">${x.type === 'entrada' ? '+' : '−'} ${brl(x.amount)}</span></td>
        <td><div class="row-actions">${canEditFin() && x.status === 'confirmado' ? `<button class="btn sm ghost" data-cancel="${x.id}">Cancelar</button>` : ''}</div></td></tr>`).join('')}
      </tbody></table></div><p class="muted" style="font-size:.82rem;margin-top:10px">${rows.length} lançamento${rows.length > 1 ? 's' : ''} no período. Lançamentos cancelados aparecem riscados e não entram nos totais.</p>`
      : `<div class="empty">Nenhum lançamento neste período.${canEditFin() ? '<br><br>Use <b>+ Entrada</b> ou <b>+ Saída</b> para lançar.' : ''}</div>`;
    $('#list').querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => cancelTx(rows.find(x => x.id === b.dataset.cancel), load));
  };
  ['#d1', '#d2', '#ac', '#tp'].forEach(s => $(s).onchange = load);
  $('#main').querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    const p = b.dataset.p, y = new Date().getFullYear();
    const [a, z] = p === 'y' ? [`${y}-01-01`, `${y}-12-31`] : monthRange(new Date(), Number(p));
    $('#d1').value = a; $('#d2').value = z; load();
  });
  if ($('#ne')) $('#ne').onclick = () => txForm('entrada', load);
  if ($('#ns')) $('#ns').onclick = () => txForm('saida', load);
  $('#pdf').onclick = () => exportCaixaModal(cur());
  await load();
  if (params.get('novo') === 'entrada' && canEditFin()) txForm('entrada', load);
}

async function txForm(type, done) {
  const cats = FIN.categories.filter(c => c.type === type && c.is_active);
  const accs = FIN.accounts.filter(a => a.is_active);
  if (!accs.length) return toast('Cadastre um caixa ativo em "Caixas e categorias".', 'err');
  if (!cats.length) return toast(`Cadastre uma categoria de ${type} em "Caixas e categorias".`, 'err');
  let mem = [];
  if (type === 'entrada') {
    const { data } = await sb.from('members').select('id,full_name').eq('organization_id', S.org.id).neq('status', 'inativo').order('full_name').limit(1000);
    mem = data || [];
  }
  modal(type === 'entrada' ? 'Nova entrada' : 'Nova saída', `<div class="stack">
    <div class="grid2"><div class="field"><label for="tv">Valor *</label><div class="money"><span>R$</span><input id="tv" name="amount" inputmode="decimal" placeholder="0,00" autocomplete="off" required></div></div>
      <div class="field"><label for="td">Data *</label><input id="td" type="date" name="occurred_on" value="${ymd(new Date())}" required></div></div>
    <div class="grid2"><div class="field"><label for="tc">Categoria *</label><select id="tc" name="category_id">${cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="ta">Caixa / conta *</label><select id="ta" name="account_id">${accs.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div></div>
    <div class="grid2"><div class="field"><label for="tf">Forma de pagamento</label><select id="tf" name="payment_method">${opts(PAY_METHODS, '')}</select></div>
      <div class="field"><label for="tn">Documento / recibo</label><input id="tn" name="document" maxlength="60" placeholder="Nº do recibo ou nota"></div></div>
    ${type === 'entrada' && mem.length ? `<div class="field"><label for="tm">Membro (dízimo ou oferta identificada)</label><select id="tm" name="member_id"><option value="">Não identificado</option>${mem.map(m => `<option value="${m.id}">${esc(m.full_name)}</option>`).join('')}</select></div>` : ''}
    <div class="field"><label for="tx">Descrição</label><input id="tx" name="description" maxlength="200" placeholder="${type === 'entrada' ? 'Ex.: Dízimos do culto de domingo' : 'Ex.: Conta de luz de novembro'}"></div></div>`,
  { submitLabel: 'Lançar', onSubmit: async fd => {
    const amount = parseValor(fd.get('amount'));
    if (!(amount > 0)) throw new Error('Informe um valor maior que zero (ex.: 150,00).');
    if (amount >= 1e12) throw new Error('Valor alto demais.');
    if (!fd.get('occurred_on')) throw new Error('Informe a data.');
    const row = { organization_id: S.org.id, created_by: S.user.id, type, amount, occurred_on: fd.get('occurred_on'),
      category_id: fd.get('category_id'), account_id: fd.get('account_id'), payment_method: fd.get('payment_method') || null,
      document: (fd.get('document') || '').trim() || null, description: (fd.get('description') || '').trim() || null, member_id: fd.get('member_id') || null };
    const { error } = await sb.from('finance_transactions').insert(row); if (error) throw error;
    toast(type === 'entrada' ? 'Entrada lançada.' : 'Saída lançada.'); done();
  } });
}

function cancelTx(x, done) {
  modal('Cancelar lançamento', `<div class="stack">
    <p class="muted">${x.type === 'entrada' ? 'Entrada' : 'Saída'} de <b>${brl(x.amount)}</b> em ${dateBR(x.occurred_on)}${x.description ? ' — ' + esc(x.description) : ''}.</p>
    <p class="muted" style="font-size:.88rem">O lançamento não é apagado: fica registrado como cancelado, fora dos totais, para a prestação de contas.${x.payable_id ? ' A conta a pagar/receber ligada a ele volta a ficar em aberto.' : ''}</p>
    <div class="field"><label for="cr">Motivo *</label><input id="cr" name="reason" maxlength="300" required placeholder="Ex.: lançado em duplicidade"></div></div>`,
  { submitLabel: 'Cancelar lançamento', busyLabel: 'Cancelando…', onSubmit: async fd => {
    const reason = (fd.get('reason') || '').trim(); if (reason.length < 3) throw new Error('Informe o motivo do cancelamento.');
    const { error } = await sb.rpc('finance_cancel_transaction', { p_tx: x.id, p_reason: reason }); if (error) throw error;
    toast('Lançamento cancelado.'); done();
  } });
}

/* --- Contas a pagar e a receber --- */
async function pageContas(params) {

    <div class="kpis" id="k"></div>
    <div class="card">
      <div class="toolbar"><input id="q" type="search" placeholder="Pesquisar descrição ou fornecedor" aria-label="Pesquisar">

      </div><div id="list">${spin}</div></div>`;
  const today = ymd(new Date());
  let timer;
  const load = async () => {
    const open = await sb.from('finance_payables').select('type,amount,due_date').eq('organization_id', S.org.id).eq('status', 'aberto').limit(5000);
    if (!open.error) {
      const sum = (t, late) => (open.data || []).filter(p => p.type === t && (!late || p.due_date < today)).reduce((s, p) => s + Number(p.amount), 0);
      const cnt = t => (open.data || []).filter(p => p.type === t && p.due_date < today).length;
      $('#k').innerHTML = `
        <div class="kpi"><small>A pagar em aberto</small><strong class="mk">${brl(sum('pagar'))}</strong></div>
        <div class="kpi"><small>A pagar vencidas</small><strong class="mk ${cnt('pagar') ? 'neg' : ''}">${brl(sum('pagar', true))}</strong><em>${cnt('pagar')} conta${cnt('pagar') === 1 ? '' : 's'}</em></div>
        <div class="kpi"><small>A receber em aberto</small><strong class="mk">${brl(sum('receber'))}</strong></div>
        <div class="kpi"><small>A receber vencidas</small><strong class="mk ${cnt('receber') ? 'neg' : ''}">${brl(sum('receber', true))}</strong><em>${cnt('receber')} conta${cnt('receber') === 1 ? '' : 's'}</em></div>`;
    }
    let q = sb.from('finance_payables').select('*').eq('organization_id', S.org.id).order('due_date', { ascending: $('#ss').value !== 'pago' }).limit(1000);
    if ($('#tp').value) q = q.eq('type', $('#tp').value);
    if ($('#ss').value) q = q.eq('status', $('#ss').value);
    const t = $('#q').value.trim().replace(/[%,()]/g, '');
    if (t) q = q.or(`description.ilike.%${t}%,counterparty.ilike.%${t}%`);
    const { data, error } = await q;
    if (error) { $('#list').innerHTML = `<div class="empty">${esc(errMsg(error))}</div>`; return; }
    const rows = data || [];
    const stPill = p => p.status === 'pago' ? `<span class="pill green">${p.type === 'pagar' ? 'Paga' : 'Recebida'} ${dateBR(p.paid_at)}</span>`
      : p.status === 'cancelado' ? '<span class="pill">Cancelada</span>'
      : p.due_date < today ? '<span class="pill red">Vencida</span>' : p.due_date === today ? '<span class="pill amber">Vence hoje</span>' : '<span class="pill blue">Em aberto</span>';
    $('#list').innerHTML = rows.length ? `<div class="table-wrap"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th class="hide-sm">Categoria</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>
      ${rows.map(p => `<tr><td style="white-space:nowrap">${dateBR(p.due_date)}</td>
        <td><b>${esc(p.description)}</b><div class="muted" style="font-size:.82rem">${p.type === 'pagar' ? 'A pagar' : 'A receber'}${p.counterparty ? ' · ' + esc(p.counterparty) : ''}</div></td>
        <td class="hide-sm">${esc(catName(p.category_id))}</td>
        <td class="num"><span class="${p.type === 'receber' ? 'v-in' : 'v-out'}">${brl(p.status === 'pago' ? p.paid_amount ?? p.amount : p.amount)}</span></td>
        <td>${stPill(p)}</td>
        <td><div class="row-actions">${canEditFin() && p.status === 'aberto' ? `<button class="btn sm" data-pay="${p.id}">${p.type === 'pagar' ? 'Pagar' : 'Receber'}</button><button class="btn sm ghost" data-edit="${p.id}">Editar</button><button class="btn sm ghost" data-cancel="${p.id}">Cancelar</button>` : ''}</div></td></tr>`).join('')}
      </tbody></table></div><p class="muted" style="font-size:.82rem;margin-top:10px">${rows.length} conta${rows.length > 1 ? 's' : ''}. Ao pagar ou receber, o lançamento entra no caixa automaticamente.</p>`
      : '<div class="empty">Nenhuma conta encontrada.</div>';
    const find = id => rows.find(p => p.id === id);
    $('#list').querySelectorAll('[data-pay]').forEach(b => b.onclick = () => settleForm(find(b.dataset.pay), load));
    $('#list').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => payableForm(find(b.dataset.edit).type, find(b.dataset.edit), load));
    $('#list').querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
      const p = find(b.dataset.cancel);
      if (!await confirmBox('Cancelar conta', `Cancelar "${p.description}" (${brl(p.amount)})? Ela sai da lista de contas em aberto.`, 'Cancelar conta', true)) return;
      const { error } = await sb.from('finance_payables').update({ status: 'cancelado' }).eq('id', p.id).eq('status', 'aberto');
      if (error) return toast(errMsg(error), 'err'); toast('Conta cancelada.'); load();
    });
  };
  $('#q').oninput = () => { clearTimeout(timer); timer = setTimeout(load, 250); };
  $('#tp').onchange = load; $('#ss').onchange = load;
  if ($('#np')) $('#np').onclick = () => payableForm('pagar', null, load);
  if ($('#nr')) $('#nr').onclick = () => payableForm('receber', null, load);
  await load();
}

function payableForm(type, p, done) {
  const ct = type === 'pagar' ? 'saida' : 'entrada';
  const cats = FIN.categories.filter(c => c.type === ct && (c.is_active || c.id === p?.category_id));
  if (!cats.length) return toast(`Cadastre uma categoria de ${ct} em "Caixas e categorias".`, 'err');
  const v = k => esc(p?.[k] ?? '');
  modal(p ? 'Editar conta' : type === 'pagar' ? 'Nova conta a pagar' : 'Nova conta a receber', `<div class="stack">
    <div class="field"><label for="pd">Descrição *</label><input id="pd" name="description" value="${v('description')}" maxlength="200" required placeholder="${type === 'pagar' ? 'Ex.: Aluguel de dezembro' : 'Ex.: Aluguel do salão para evento'}"></div>
    <div class="field"><label for="pc">${type === 'pagar' ? 'Fornecedor / favorecido' : 'Quem vai pagar'}</label><input id="pc" name="counterparty" value="${v('counterparty')}" maxlength="120"></div>
    <div class="grid2"><div class="field"><label for="pv">Valor *</label><div class="money"><span>R$</span><input id="pv" name="amount" inputmode="decimal" value="${esc(moneyField(p?.amount))}" placeholder="0,00" autocomplete="off" required></div></div>
      <div class="field"><label for="pdd">Vencimento *</label><input id="pdd" type="date" name="due_date" value="${v('due_date') || ymd(new Date())}" required></div></div>
    <div class="field"><label for="pk">Categoria *</label><select id="pk" name="category_id">${cats.map(c => `<option value="${c.id}" ${c.id === p?.category_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="po">Observações</label><textarea id="po" name="notes" maxlength="1000">${v('notes')}</textarea></div></div>`,
  { submitLabel: p ? 'Salvar alterações' : 'Cadastrar', onSubmit: async fd => {
    const amount = parseValor(fd.get('amount'));
    const row = { description: (fd.get('description') || '').trim(), counterparty: (fd.get('counterparty') || '').trim() || null, amount,
      due_date: fd.get('due_date'), category_id: fd.get('category_id'), notes: (fd.get('notes') || '').trim() || null };
    if (row.description.length < 2) throw new Error('Informe a descrição.');
    if (!(amount > 0)) throw new Error('Informe um valor maior que zero (ex.: 150,00).');
    if (!row.due_date) throw new Error('Informe o vencimento.');
    const r = p ? await sb.from('finance_payables').update(row).eq('id', p.id).eq('status', 'aberto')
      : await sb.from('finance_payables').insert({ ...row, type, organization_id: S.org.id, created_by: S.user.id });
    if (r.error) throw r.error; toast(p ? 'Conta atualizada.' : 'Conta cadastrada.'); done();
  } });
}

function settleForm(p, done) {
  const accs = FIN.accounts.filter(a => a.is_active);
  if (!accs.length) return toast('Cadastre um caixa ativo em "Caixas e categorias".', 'err');
  const verb = p.type === 'pagar' ? 'Pagar' : 'Receber';
  modal(`${verb} conta`, `<div class="stack">
    <p class="muted"><b>${esc(p.description)}</b> — vencimento ${dateBR(p.due_date)}. O valor entra no caixa como ${p.type === 'pagar' ? 'saída' : 'entrada'} na categoria ${esc(catName(p.category_id))}.</p>
    <div class="grid2"><div class="field"><label for="sv">Valor ${p.type === 'pagar' ? 'pago' : 'recebido'} *</label><div class="money"><span>R$</span><input id="sv" name="amount" inputmode="decimal" value="${esc(moneyField(p.amount))}" autocomplete="off" required></div></div>
      <div class="field"><label for="sd">Data *</label><input id="sd" type="date" name="date" value="${ymd(new Date())}" required></div></div>
    <div class="grid2"><div class="field"><label for="sa">Caixa / conta *</label><select id="sa" name="account">${accs.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="sf">Forma de pagamento</label><select id="sf" name="method">${opts(PAY_METHODS, 'pix')}</select></div></div></div>`,
  { submitLabel: `Confirmar ${verb.toLowerCase() === 'pagar' ? 'pagamento' : 'recebimento'}`, busyLabel: 'Registrando…', onSubmit: async fd => {
    const amount = parseValor(fd.get('amount'));
    if (!(amount > 0)) throw new Error('Informe um valor maior que zero.');
    if (!fd.get('date')) throw new Error('Informe a data.');
    const { error } = await sb.rpc('finance_settle_payable', { p_payable: p.id, p_account: fd.get('account'), p_paid_on: fd.get('date'), p_amount: amount, p_method: fd.get('method') || null });
    if (error) throw error; toast(p.type === 'pagar' ? 'Pagamento registrado no caixa.' : 'Recebimento registrado no caixa.'); done();
  } });
}

/* --- Exportação do caixa em PDF --- */
function exportCaixaModal(d) {
  modal('Exportar caixa em PDF', `<div class="stack">
    <p class="muted">O PDF traz o saldo anterior, todos os lançamentos do período com o saldo linha a linha, os totais, o resumo por categoria e espaço para assinaturas, pronto para a prestação de contas.</p>
    <div class="grid2"><div class="field"><label for="xs">De *</label><input id="xs" type="date" name="start" value="${esc(d.start)}" required></div>
      <div class="field"><label for="xe">Até *</label><input id="xe" type="date" name="end" value="${esc(d.end)}" required></div></div>
    <div class="field"><label for="xa">Caixa / conta</label><select id="xa" name="account"><option value="">Todos os caixas</option>${FIN.accounts.map(a => `<option value="${a.id}" ${a.id === d.account ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div></div>`,
  { submitLabel: 'Baixar PDF', busyLabel: 'Gerando PDF…', onSubmit: async fd => {
    const start = fd.get('start'), end = fd.get('end');
    if (!start || !end || end < start) throw new Error('Escolha um período válido.');
    const { data, error } = await sb.rpc('finance_cash_report', { p_org: S.org.id, p_start: start, p_end: end, p_account: fd.get('account') || null });
    if (error) throw error;
    const bytes = await buildCashPdf(data);
    downloadFile(bytes, `caixa-${slug(S.org.name)}-${start}-a-${end}.pdf`, 'application/pdf');
    toast('PDF gerado.');
  } });
}
function downloadFile(bytes, name, type) {
  const url = URL.createObjectURL(new Blob([bytes], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
async function buildCashPdf(r) {
  let lib;
  try { lib = await import('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm'); }
  catch { throw new Error('Não foi possível carregar o gerador de PDF. Verifique sua conexão e tente novamente.'); }
  const { PDFDocument, StandardFonts, rgb } = lib;
  const doc = await PDFDocument.create();
  const F = await doc.embedFont(StandardFonts.Helvetica), B = await doc.embedFont(StandardFonts.HelveticaBold);
  const W = 595.28, H = 841.89, M = 36, CW = W - 2 * M;
  const navy = rgb(0.043, 0.122, 0.227), muted = rgb(0.36, 0.4, 0.51), line = rgb(0.86, 0.88, 0.92), soft = rgb(0.955, 0.965, 0.98);
  const green = rgb(0.08, 0.58, 0.36), red = rgb(0.82, 0.27, 0.23), gold = rgb(0.79, 0.64, 0.29);
  const clean = s => String(s ?? '').normalize('NFC').replace(/[  ]/g, ' ').replace(/[−]/g, '-').replace(/[^\x20-\x7E\xA0-\xFF–—‘’“”•…]/g, '');
  const fit = (s, font, size, w) => { s = clean(s); if (font.widthOfTextAtSize(s, size) <= w) return s; while (s.length && font.widthOfTextAtSize(s + '…', size) > w) s = s.slice(0, -1); return s + '…'; };
  const money = n => clean(brl(n));
  const title = `${r.igreja || ''}`, period = `${dateBR(r.inicio)} a ${dateBR(r.fim)}`;
  doc.setTitle(`Relatório de caixa - ${clean(title)} - ${period}`); doc.setAuthor('Gestão do Reino'); doc.setCreator('Gestão do Reino'); doc.setProducer('Gestão do Reino');
  let page, y;
  const T = (s, x, yy, o = {}) => {
    const font = o.font || F, size = o.size || 9, t = o.w ? fit(s, font, size, o.w) : clean(s);
    page.drawText(t, { x: o.right ? x - font.widthOfTextAtSize(t, size) : x, y: yy, size, font, color: o.color || navy });
  };
  const hr = (yy, c = line, th = 0.6) => page.drawLine({ start: { x: M, y: yy }, end: { x: W - M, y: yy }, thickness: th, color: c });
  const cols = [{ t: 'Data', w: 54 }, { t: 'Categoria', w: 100 }, { t: 'Descrição', w: 160 }, { t: 'Entrada', w: 70, r: 1 }, { t: 'Saída', w: 70, r: 1 }, { t: 'Saldo', w: CW - 454, r: 1 }];
  const row = (vals, o = {}) => {
    let x = M;
    if (o.fill) page.drawRectangle({ x: M, y: y - 5, width: CW, height: 17, color: o.fill });
    cols.forEach((c, i) => {
      const v = vals[i]; if (v != null && v !== '') T(v, c.r ? x + c.w - 4 : x + 4, y, { w: c.w - 8, right: !!c.r, size: o.size || 8.5, font: o.bold ? B : F, color: (o.colors && o.colors[i]) || navy });
      x += c.w;
    });
    y -= 17;
  };
  const head = () => { page.drawRectangle({ x: M, y: y - 6, width: CW, height: 19, color: soft }); row(cols.map(c => c.t), { bold: true, size: 8, colors: cols.map(() => muted) }); y -= 2; };
  const newPage = (first, withHead = true) => {
    page = doc.addPage([W, H]); y = H - M;
    if (first) {
      page.drawRectangle({ x: 0, y: H - 6, width: W, height: 6, color: gold });
      T(title, M, y - 14, { font: B, size: 16, w: CW });
      T('Relatório de caixa', M, y - 32, { size: 11, color: muted });
      T(`Período: ${period}   ·   Caixa: ${r.conta || 'Todos os caixas'}`, M, y - 48, { size: 9.5, w: CW });
      T(`Gerado em ${new Date(r.gerado_em || Date.now()).toLocaleString('pt-BR')} pelo Gestão do Reino`, M, y - 62, { size: 8, color: muted });
      y -= 82;
      const bw = (CW - 24) / 4;
      [['Saldo anterior', r.saldo_inicial, navy], ['Entradas', r.total_entradas, green], ['Saídas', r.total_saidas, red], ['Saldo final', r.saldo_final, Number(r.saldo_final) < 0 ? red : navy]].forEach(([l, v, c], i) => {
        const x = M + i * (bw + 8);
        page.drawRectangle({ x, y: y - 40, width: bw, height: 44, color: soft, borderColor: line, borderWidth: 0.6 });
        T(l, x + 10, y - 12, { size: 8, color: muted }); T(money(v), x + 10, y - 30, { font: B, size: 12.5, color: c, w: bw - 16 });
      });
      y -= 62;
    } else {
      T(`${title} - Relatório de caixa (${period})`, M, y - 8, { size: 8, color: muted, w: CW }); y -= 24;
    }
    if (withHead) head();
  };
  const need = h => { if (y - h < M + 24) newPage(false); };
  newPage(true);
  row([dateBR(r.inicio), '', 'Saldo anterior', '', '', money(r.saldo_inicial)], { bold: true });
  hr(y + 12);
  const lines = r.lancamentos || [];
  lines.forEach(l => {
    need(17);
    row([dateBR(l.data), l.categoria, l.descricao || l.categoria, Number(l.entrada) ? money(l.entrada) : '', Number(l.saida) ? money(l.saida) : '', money(l.saldo)],
      { colors: [null, null, null, green, red, Number(l.saldo) < 0 ? red : null] });
    hr(y + 12);
  });
  if (!lines.length) { row(['', '', 'Nenhum lançamento no período.', '', '', ''], { colors: cols.map(() => muted) }); }
  need(22);
  y -= 2; hr(y + 14, navy, 0.9);
  row(['', '', 'Totais do período', money(r.total_entradas), money(r.total_saidas), money(r.saldo_final)], { bold: true, fill: soft, colors: [null, null, null, green, red, Number(r.saldo_final) < 0 ? red : null] });

  const cats = r.por_categoria || [];
  if (cats.length) {
    const ins = cats.filter(c => c.tipo === 'entrada'), outs = cats.filter(c => c.tipo === 'saida');
    const block = Math.max(ins.length, outs.length) * 15 + 40;
    if (y - block < M + 24) newPage(false, false);
    y -= 18; T('Resumo por categoria', M, y, { font: B, size: 11 }); y -= 18;
    const half = (CW - 20) / 2, top = y;
    [[ins, 'Entradas', green, M], [outs, 'Saídas', red, M + half + 20]].forEach(([list, lab, c, x]) => {
      let yy = top;
      T(lab, x, yy, { font: B, size: 9, color: c }); yy -= 4;
      page.drawLine({ start: { x, y: yy }, end: { x: x + half, y: yy }, thickness: 0.6, color: line }); yy -= 12;
      if (!list.length) { T('Nenhuma', x, yy, { size: 8.5, color: muted }); yy -= 15; }
      list.forEach(it => { T(it.categoria, x, yy, { size: 8.5, w: half - 90 }); T(money(it.total), x + half, yy, { size: 8.5, right: true }); yy -= 15; });
      y = Math.min(y, yy);
    });
  }
  if (y - 80 < M + 24) newPage(false, false);
  y -= 64;
  const sw = (CW - 40) / 2;
  [['Tesoureiro(a)', M], ['Pastor(a) / Presidente', M + sw + 40]].forEach(([l, x]) => {
    page.drawLine({ start: { x, y }, end: { x: x + sw, y }, thickness: 0.7, color: navy });
    T(l, x + sw / 2 - F.widthOfTextAtSize(clean(l), 8.5) / 2, y - 12, { size: 8.5, color: muted });
  });
  const pages = doc.getPages();
  pages.forEach((p, i) => {
    const s = clean(`Gestão do Reino   ·   Página ${i + 1} de ${pages.length}`);
    p.drawText(s, { x: W - M - F.widthOfTextAtSize(s, 7.5), y: 20, size: 7.5, font: F, color: muted });
  });
  return await doc.save();
}

      const price = parseMoney(fd.get('price')); if (price === null) throw new Error('Valor inválido.');
      const code = fd.get('code').trim(); if (!/^[a-z0-9_-]{2,40}$/.test(code)) throw new Error('Código inválido: use letras minúsculas, números, - ou _.');
      const { error } = await sb.from('plans').insert({ name: fd.get('name').trim(), code, price_monthly: price, sort_order: plans.length + 1, is_active: false });
      if (error) throw new Error(error.code === '23505' ? 'Já existe um plano com este código.' : errMsg(error)); toast('Plano criado como inativo. Complete e ative.'); pageAdminPlanos(); } });
  document.querySelectorAll('form[data-plan]').forEach(f => f.onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(f), btn = f.querySelector('[type=submit]');
    const pm = parseMoney(fd.get('price_monthly')), py = fd.get('price_yearly').trim() ? parseMoney(fd.get('price_yearly')) : null;
    if (pm === null) return toast('Mensalidade inválida.', 'err');
    if (fd.get('price_yearly').trim() && py === null) return toast('Valor anual inválido.', 'err');
    const intOrNull = k => { const v = fd.get(k).trim(); return v ? Math.max(1, parseInt(v, 10)) : null; };
    const row = { name: fd.get('name').trim(), description: fd.get('description').trim(), price_monthly: pm, price_yearly: py,
      max_users: intOrNull('max_users'), max_congregations: intOrNull('max_congregations'),
      features: fd.get('features').split('\n').map(s => s.trim()).filter(Boolean), cta_label: fd.get('cta_label').trim() || 'Começar teste grátis',
      is_featured: fd.get('is_featured') === 'on', is_active: fd.get('is_active') === 'on', sort_order: parseInt(fd.get('sort_order'), 10) || 0 };
    if (row.name.length < 2) return toast('Informe o nome do plano.', 'err');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const { error } = await sb.from('plans').update(row).eq('id', f.dataset.plan);
    btn.disabled = false; btn.textContent = 'Salvar plano';
    if (error) return toast(errMsg(error), 'err'); toast(`Plano ${row.name} salvo.`);
  });
}
const parseMoney = s => { s = String(s || '').trim().replace(/[R$\s]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return s !== '' && isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null; };
const moneyIn = n => n === null || n === undefined ? '' : Number(n).toFixed(2).replace('.', ',');
function planCard(p) {
  return `<form class="plan-card ${p.is_featured ? 'featured' : ''}" data-plan="${p.id}" novalidate>
    <header><h3>${esc(p.name)}</h3><span class="pill ${p.is_active ? 'green' : ''}">${p.is_active ? 'Ativo no site' : 'Inativo'}</span></header>
    <div class="grid2"><div class="field"><label>Nome</label><input name="name" value="${esc(p.name)}" maxlength="60"></div>
      <div class="field"><label>Ordem no site</label><input name="sort_order" type="number" value="${p.sort_order}"></div></div>
    <div class="grid2"><div class="field"><label>Mensalidade</label><div class="money"><span>R$</span><input name="price_monthly" inputmode="decimal" value="${moneyIn(p.price_monthly)}"></div></div>
      <div class="field"><label>Valor anual</label><div class="money"><span>R$</span><input name="price_yearly" inputmode="decimal" value="${moneyIn(p.price_yearly)}" placeholder="${moneyIn(p.price_monthly * 10)}"></div><small>Vazio = 10 mensalidades</small></div></div>
    <div class="grid2"><div class="field"><label>Limite de usuários</label><input name="max_users" type="number" min="1" value="${p.max_users ?? ''}" placeholder="Ilimitado"></div>
      <div class="field"><label>Limite de congregações</label><input name="max_congregations" type="number" min="1" value="${p.max_congregations ?? ''}" placeholder="Ilimitado"></div></div>
    <div class="field"><label>Descrição</label><textarea name="description" rows="2">${esc(p.description)}</textarea></div>
    <div class="field"><label>Itens exibidos no site</label><textarea name="features" rows="5">${esc((p.features || []).join('\n'))}</textarea><small>Um item por linha</small></div>
    <div class="field"><label>Texto do botão</label><input name="cta_label" value="${esc(p.cta_label)}" maxlength="40"></div>
    <label class="check"><input type="checkbox" name="is_featured" ${p.is_featured ? 'checked' : ''}> Destacar como "mais escolhido"</label>
    <label class="check"><input type="checkbox" name="is_active" ${p.is_active ? 'checked' : ''}> Exibir no site e permitir novas assinaturas</label>
    <button class="btn" type="submit">Salvar plano</button></form>`;
}

/* ===== Roteador ===== */
async function render() {
  const { route, params } = hashParams();
  if (S.recovering) return viewNewPassword();
  if (!S.session) {
    if (route === 'cadastro') return viewSignup(params);
    if (route === 'recuperar') return viewRecover();
    return viewLogin();
  }
  try {
    if (['entrar', 'cadastro', 'recuperar', ''].includes(route)) return go(S.org ? 'painel' : S.isAdmin ? 'admin' : 'criar-igreja');
    if (route.startsWith('admin')) {
      if (!S.isAdmin) return go('painel');
      if (route === 'admin') return pageAdmin();
      if (route === 'admin-igrejas') return pageAdminIgrejas();
      if (route === 'admin-planos') return pageAdminPlanos();
      if (route === 'admin-financeiro') return pageAdminFinanceiro();
    }
    if (route === 'versoes') return S.isAdmin ? pageVersoes() : go(S.org ? 'painel' : 'criar-igreja');
    if (!S.org) return S.isAdmin && route !== 'criar-igreja' ? go('admin') : pageCriarIgreja();
    if (route === 'membros') return pageMembros(params);
    if (route === 'igreja') return pageIgreja();
    if (['caixa', 'contas', 'fin-config'].includes(route)) {
      if (!canSeeFin()) { toast('Seu perfil não tem acesso ao financeiro.', 'err'); return go('painel'); }
      if (route === 'caixa') return await pageCaixa(params);
      if (route === 'contas') return await pageContas(params);
      return await pageFinConfig();
    }
    return pagePainel();
  } catch (e) { toast(errMsg(e), 'err'); }
}
window.addEventListener('hashchange', render);

let booted = false;
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') S.recovering = true;
  if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') { S.session = session; return; }
  const changed = (S.session?.user?.id || null) !== (session?.user?.id || null);
  S.session = session;
  if (!booted || changed || event === 'PASSWORD_RECOVERY') {
    booted = true;
    setTimeout(async () => { try { await loadContext(); } catch (e) { toast(errMsg(e), 'err'); } if (!session) { S.org = null; S.isAdmin = false; } render(); }, 0);
  }
});
</script>
